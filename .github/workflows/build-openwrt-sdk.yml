name: build (apk release)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-release
  cancel-in-progress: false

env:
  PKG_NAME: luci-app-openlistui

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      pkg_version: ${{ steps.ver.outputs.pkg_version }}
      tag_name: ${{ steps.ver.outputs.tag_name }}
      release_name: ${{ steps.ver.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PKG_VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "Makefile" ]]; then
            echo "❌ Makefile not found at repo root"
            exit 1
          fi

          PKG_VERSION="$(grep -E '^\s*PKG_VERSION\s*:?=' Makefile | head -n1 | sed -E 's/.*PKG_VERSION\s*:?=\s*//; s/\r$//')"
          if [[ -z "${PKG_VERSION}" ]]; then
            echo "❌ Cannot parse PKG_VERSION from Makefile"
            exit 1
          fi

          TAG_NAME="v${PKG_VERSION}"
          RELEASE_NAME="${{ env.PKG_NAME }} ${TAG_NAME}"

          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

          echo "PKG_VERSION=${PKG_VERSION}"
          echo "TAG_NAME=${TAG_NAME}"
          echo "RELEASE_NAME=${RELEASE_NAME}"

      - name: Create or reuse GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.ver.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.ver.outputs.release_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "✅ Release exists: $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes "Automated build for $RELEASE_NAME"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, mips, mipsel, arm, armv7]

    env:
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo apt-get clean
          df -h

      - name: Install deps
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-venv \
            rsync unzip zlib1g-dev file wget curl jq zstd

      - name: Run build.sh (${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build.sh

          echo "== build.sh help =="
          ./build.sh || true

          echo "== start build arch: ${{ matrix.arch }} =="
          ./build.sh "${{ matrix.arch }}"

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          # 通用收集：把所有 .apk 找出来（排除一些大目录/临时目录）
          mapfile -t APKS < <(
            find . \
              -type d \( -name .git -o -name .github -o -name ".cache" -o -name "build_dir" \) -prune -false \
              -o -type f -name "*.apk" -print
          )

          if [[ "${#APKS[@]}" -eq 0 ]]; then
            echo "❌ No .apk produced for arch=${{ matrix.arch }}"
            echo "Workspace top:"
            ls -lah
            exit 3
          fi

          SAFE_ARCH="${{ matrix.arch }}"
          for f in "${APKS[@]}"; do
            base="$(basename "$f")"
            cp -v "$f" "out/${SAFE_ARCH}__${base}"
          done

          echo "Collected:"
          ls -lah out

      - name: Upload APKs to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${TAG_NAME}" out/*.apk --clobber

      - name: Upload workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.arch }}
          path: out/*.apk
          if-no-files-found: error
