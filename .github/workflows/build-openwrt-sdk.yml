name: Build OpenWrt package with SDK (snapshots)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # 你的“ARM 设备”常见目标（IPQ60xx / aarch64_cortex-a53）
          - target: qualcommax
            subtarget: ipq60xx

          # 你也可以顺手加别的目标，例如：
          # - target: rockchip
          #   subtarget: armv8
          # - target: mediatek
          #   subtarget: filogic
          # - target: ramips
          #   subtarget: mt76x8

    env:
      PKG_NAME: luci-app-openlistui
      BASE: https://downloads.openwrt.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-setuptools python3-venv \
            rsync unzip zlib1g-dev file wget curl jq zstd

          python3 -V
          dpkg -l | grep -E "python3-setuptools|python3-venv" || true

      - name: Resolve SDK URL
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.target }}"
          SUBTARGET="${{ matrix.subtarget }}"
          IDX="${BASE}/snapshots/targets/${TARGET}/${SUBTARGET}/"

          echo "Index: ${IDX}"

          HTML="$(curl -fsSL "${IDX}")"

          # 兼容 .tar.zst / .tar.xz，且注意文件名里有 ".Linux-x86_64"
          SDK_TARBALL="$(
            echo "$HTML" \
              | grep -oE 'openwrt-sdk-[^"]+\.Linux-(x86_64|aarch64)\.tar\.(zst|xz)' \
              | head -n1
          )"

          if [ -z "${SDK_TARBALL:-}" ]; then
            echo "❌ Cannot find SDK tarball on ${IDX}"
            echo "Tip: page contains these SDK-like entries:"
            echo "$HTML" | grep -oE 'openwrt-sdk-[^"]+' | head -n 20 || true
            exit 1
          fi

          SDK_URL="${IDX}${SDK_TARBALL}"

          echo "SDK_TARBALL=${SDK_TARBALL}" >> "$GITHUB_OUTPUT"
          echo "SDK_URL=${SDK_URL}" >> "$GITHUB_OUTPUT"

          echo "Found SDK: ${SDK_TARBALL}"
          echo "URL:       ${SDK_URL}"

      - name: Download & extract SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_URL="${{ steps.sdk.outputs.SDK_URL }}"
          SDK_TARBALL="${{ steps.sdk.outputs.SDK_TARBALL }}"

          mkdir -p sdk
          if [[ "$SDK_TARBALL" == *.tar.zst ]]; then
            wget -q --show-progress -O sdk.tar.zst "$SDK_URL"
            tar --zstd -xf sdk.tar.zst --strip-components=1 -C sdk
          else
            wget -q --show-progress -O sdk.tar.xz "$SDK_URL"
            tar -xf sdk.tar.xz --strip-components=1 -C sdk
          fi

          echo "SDK extracted."
          ls -la sdk | head

      - name: Inject package into SDK and build
        shell: bash
        run: |
          set -euo pipefail

          # 把当前仓库当做一个 package 丢进 SDK
          rm -rf "sdk/package/${PKG_NAME}"
          mkdir -p "sdk/package/${PKG_NAME}"
          rsync -a --delete ./ "sdk/package/${PKG_NAME}/"

          cd sdk

          # 有些 target SDK 不一定自带 feeds 脚本，但一般都有
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 只编译你的包（更快）
          # 说明：package/<pkg>/Makefile 里如果是 LuCI 包，一般输出到 bin/packages/*/luci/
          make defconfig
          make package/${PKG_NAME}/compile -j"$(nproc)" V=s

          echo "Build done. Output tree:"
          find bin -maxdepth 4 -type f \( -name "*.ipk" -o -name "*.apk" \) -print || true

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd sdk

          # 兼容 ipk / apk（看你 SDK/仓库最终产出什么）
          find bin -type f \( -name "*.ipk" -o -name "*.apk" \) -print -exec cp -v {} ../out/ \; || true

          cd ..
          ls -la out || true

          # 没产物就直接失败，方便你定位
          if ! ls out/* >/dev/null 2>&1; then
            echo "❌ No ipk/apk produced."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.target }}-${{ matrix.subtarget }}
          path: out/*

      # 可选：push tag 时发 Release 并上传 out/*
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
