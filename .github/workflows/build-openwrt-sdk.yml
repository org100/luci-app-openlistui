name: build (apk release)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-release
  cancel-in-progress: false

env:
  PKG_NAME: luci-app-openlistui

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release tag (robust)
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./build.sh || true

          # 1) 尝试从 build.sh 获取版本（如果脚本支持）
          VER=""
          if ./build.sh --version >/dev/null 2>&1; then
            VER="$(./build.sh --version | tr -d '\r' | head -n1 | sed -E 's/[^0-9.].*//; s/^[^0-9]*//')"
          elif ./build.sh -v >/dev/null 2>&1; then
            VER="$(./build.sh -v | tr -d '\r' | head -n1 | sed -E 's/[^0-9.].*//; s/^[^0-9]*//')"
          fi

          # 2) 尝试从项目内的“插件 Makefile”读取固定版本（避免根 Makefile 的 $(shell )）
          # 只接受形如 1.2.3 的版本
          if [[ -z "$VER" ]]; then
            for f in \
              "./Makefile" \
              "./package/${{ env.PKG_NAME }}/Makefile" \
              "./${{ env.PKG_NAME }}/Makefile" \
              "./luci-app-openlistui/Makefile"
            do
              if [[ -f "$f" ]]; then
                CAND="$(grep -E '^\s*PKG_VERSION\s*:?=\s*[0-9]([0-9.]*[0-9])\s*$' "$f" \
                  | head -n1 \
                  | sed -E 's/.*PKG_VERSION\s*:?=\s*//; s/\s*$//')"
                if [[ -n "$CAND" ]]; then
                  VER="$CAND"
                  break
                fi
              fi
            done
          fi

          # 3) 兜底：日期 + gitsha，保证 tag 永远合法
          if [[ -z "$VER" ]]; then
            DATE="$(date -u +%Y%m%d)"
            SHA="$(git rev-parse --short=8 HEAD)"
            TAG="r${DATE}-${SHA}"
          else
            TAG="v${VER}"
          fi

          RELEASE_NAME="${{ env.PKG_NAME }} ${TAG}"

          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

          echo "Resolved TAG=${TAG}"
          echo "Release name: ${RELEASE_NAME}"

      - name: Create or reuse GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "✅ Release exists: $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes "Automated build for $RELEASE_NAME"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, mips, mipsel, arm, armv7]

    env:
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo apt-get clean
          df -h

      - name: Install deps
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-venv \
            rsync unzip zlib1g-dev file wget curl jq zstd

      - name: Run build.sh (${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          echo "== start build arch: ${{ matrix.arch }} =="
          ./build.sh "${{ matrix.arch }}"

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          # 收集所有 .apk（排除常见大目录/临时目录）
          mapfile -t APKS < <(
            find . \
              -type d \( -name .git -o -name .github -o -name ".cache" -o -name "build_dir" -o -name "sdk" \) -prune -false \
              -o -type f -name "*.apk" -print
          )

          if [[ "${#APKS[@]}" -eq 0 ]]; then
            echo "❌ No .apk produced for arch=${{ matrix.arch }}"
            echo "Workspace top:"
            ls -lah
            exit 3
          fi

          for f in "${APKS[@]}"; do
            base="$(basename "$f")"
            cp -v "$f" "out/${{ matrix.arch }}__${base}"
          done

          echo "Collected:"
          ls -lah out

      - name: Upload APKs to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${TAG_NAME}" out/*.apk --clobber

      - name: Upload workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.arch }}
          path: out/*.apk
          if-no-files-found: error
