name: Build OpenWrt package (luci-app-openlistui)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target arch to build (arm/armv7/aarch64/mips/mipsel/x86_64/all)"
        required: true
        default: "arm"
      fast:
        description: "Fast mode (skip feeds update) true/false"
        required: true
        default: "true"
      dev:
        description: "Dev mode (timestamp suffix) true/false"
        required: true
        default: "false"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键：先腾磁盘（否则 OpenWrt SDK + build 很容易爆）
      - name: Free disk space
        shell: bash
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Install dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-setuptools python3-venv \
            rsync unzip zlib1g-dev file wget curl jq zstd

      # 关键：修复 build.sh 的 rsync 递归复制问题（排除 build*/sdk/.git/打包文件）
      - name: Patch build.sh (avoid rsync recursion)
        shell: bash
        run: |
          set -eux
          test -f build.sh
          chmod +x build.sh

          # 把原来的 rsync 行替换成带 exclude 的版本
          # 原脚本用 rsync 把仓库复制进 sdk/package/${PKG_NAME}，需要排除 build 输出目录，否则无限套娃
          perl -0777 -i -pe 's#rsync\s+-a\s+--delete\s+\./\s+"sdk/package/\$\{PKG_NAME\}/"#rsync -a --delete \\\n  --exclude \x27.git\x27 \\\n  --exclude \x27.github\x27 \\\n  --exclude \x27build-*\x27 \\\n  --exclude \x27sdk\x27 \\\n  --exclude \x27*.tar.*\x27 \\\n  --exclude \x27*.ipk\x27 \\\n  --exclude \x27*.apk\x27 \\\n  ./ "sdk/package/${PKG_NAME}/"#g' build.sh

          # 防止之前残留目录影响（可选）
          rm -rf build-* sdk || true

      - name: Build
        shell: bash
        env:
          # 如果你要避免 GitHub API rate limit，可在仓库 Secrets 里加 GH_API_TOKEN
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          set -eux

          ARCH="${{ inputs.arch }}"
          FAST="${{ inputs.fast }}"
          DEV="${{ inputs.dev }}"

          args=()

          # build.sh 支持 -t token（用于获取 releases 版本号，脚本里有这个逻辑）:contentReference[oaicite:2]{index=2}
          if [ -n "${GH_API_TOKEN:-}" ]; then
            args+=("-t" "${GH_API_TOKEN}")
          fi

          # fast/dev 开关
          if [ "${FAST}" = "true" ]; then
            args+=("--fast")
          fi
          if [ "${DEV}" = "true" ]; then
            args+=("--dev")
          fi

          # 多线程：给它一个合理的 jobs
          # 你的脚本支持 -j 参数:contentReference[oaicite:3]{index=3}
          args+=("-j" "$(nproc)")

          # 运行
          ./build.sh "${args[@]}" "${ARCH}"

          echo "==== OUTPUT ===="
          find . -type f \( -name "*.ipk" -o -name "*.apk" \) -print || true

      - name: Collect artifacts
        shell: bash
        run: |
          set -eux
          mkdir -p dist

          # build.sh 默认生成 build-<arch>/...，把所有 ipk/apk 收集出来
          find . -type f \( -name "*.ipk" -o -name "*.apk" \) -print -exec cp -v {} dist/ \; || true

          # 给一个目录树方便排查
          ls -lah dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-openlistui-${{ inputs.arch }}
          path: dist/*
          if-no-files-found: error
