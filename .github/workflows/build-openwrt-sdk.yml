name: Build APK (all arch) and Release

on:
  workflow_dispatch:
  push:
    paths:
      - "Makefile"
      - "luasrc/**"
      - "root/**"
      - "po/**"
      - "htdocs/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

env:
  PKG_NAME: luci-app-openlistui

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag (safe)
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VER=""
          if [[ -f "Makefile" ]]; then
            VER="$(grep -E '^\s*PKG_VERSION_BASE\s*:?=' Makefile | head -n1 | sed -E 's/.*PKG_VERSION_BASE\s*:?=\s*//; s/\r$//; s/[[:space:]]+$//' || true)"
          fi

          if [[ -z "$VER" ]]; then
            DATE="$(date -u +%Y%m%d)"
            SHA="$(git rev-parse --short=8 HEAD)"
            TAG="r${DATE}-${SHA}"
          else
            TAG="v${VER}"
          fi

          RELEASE_NAME="${{ env.PKG_NAME }} ${TAG}"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG=${TAG}"
          echo "Release name: ${RELEASE_NAME}"

      - name: Create release (if not exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "✅ Release exists: $TAG_NAME"
          else
            gh release create "$TAG_NAME" --title "$RELEASE_NAME" --notes "Automated build for $RELEASE_NAME"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, mips, mipsel, arm, armv7]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (Ubuntu 24.04 fixed)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk flex bison gettext \
            libncurses-dev libssl-dev \
            python3 python3-pip python3-setuptools \
            unzip file wget rsync ca-certificates zstd xz-utils \
            git

          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Set exact SDK URL (NO listing parse / NO CF challenge)
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          arch="${{ matrix.arch }}"

          # 这里写“精确文件名”，避免依赖目录 HTML（你日志里已有 CF challenge）
          # 你贴出来的 x86_64 是 gcc-14.3.0，下面按同一版本先写死。
          # 如果某个架构目录里 gcc 版本不同，把对应那行改成目录里的真实文件名即可。

          case "$arch" in
            x86_64)
              SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/x86/64/immortalwrt-sdk-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
              ;;
            aarch64)
              SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/immortalwrt-sdk-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
              ;;
            mips)
              SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/ath79/generic/immortalwrt-sdk-ath79-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
              ;;
            mipsel)
              SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/ramips/mt76x8/immortalwrt-sdk-ramips-mt76x8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
              ;;
            arm)
              SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/bcm27xx/bcm2708/immortalwrt-sdk-bcm27xx-bcm2708_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst"
              ;;
            armv7)
              SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/bcm27xx/bcm2709/immortalwrt-sdk-bcm27xx-bcm2709_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst"
              ;;
            *)
              echo "Unknown arch: $arch"
              exit 1
              ;;
          esac

          echo "sdk_url=$SDK_URL" >> "$GITHUB_OUTPUT"
          echo "Using SDK_URL=$SDK_URL"

      - name: Download & extract SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sdk
          cd sdk
          wget -q --show-progress -O sdk.tar.zst "${{ steps.sdk.outputs.sdk_url }}"
          tar --use-compress-program=unzstd -xf sdk.tar.zst --strip-components=1
          echo "SDK extracted:"
          ls -la

      - name: Copy package into SDK (NO recursion / NO rsync blow-up)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "sdk/package/${{ env.PKG_NAME }}"
          mkdir -p "sdk/package/${{ env.PKG_NAME }}"

          cp -a Makefile "sdk/package/${{ env.PKG_NAME }}/"
          [[ -d luasrc ]] && cp -a luasrc "sdk/package/${{ env.PKG_NAME }}/"
          [[ -d root ]] && cp -a root "sdk/package/${{ env.PKG_NAME }}/"
          [[ -d po ]] && cp -a po "sdk/package/${{ env.PKG_NAME }}/"
          [[ -d htdocs ]] && cp -a htdocs "sdk/package/${{ env.PKG_NAME }}/"

          echo "Package files copied:"
          find "sdk/package/${{ env.PKG_NAME }}" -maxdepth 3 -type f | sed -n '1,200p'

      - name: Build (APK)
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "CONFIG_PACKAGE_${{ env.PKG_NAME }}=y" > .config
          make defconfig

          make "package/${{ env.PKG_NAME }}/compile" -j"$(nproc)" V=s

          echo "Output (.apk/.ipk):"
          find bin -type f \( -name "*.apk" -o -name "*.ipk" \) -print || true

      - name: Collect APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          mapfile -t apks < <(find sdk/bin -type f -name "*${{ env.PKG_NAME }}*.apk" || true)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "❌ No .apk found. Dumping outputs for debug:"
            find sdk/bin -maxdepth 6 -type f \( -name "*.apk" -o -name "*.ipk" \) -print || true
            exit 1
          fi

          for f in "${apks[@]}"; do
            cp -v "$f" "dist/${{ matrix.arch }}-$(basename "$f")"
          done

          ls -lah dist

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" dist/*.apk --clobber
