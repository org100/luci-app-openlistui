name: build luci-app-openlistui (apk)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "make -j threads"
        required: false
        default: "4"
      fast:
        description: "skip feeds update (true/false)"
        required: false
        default: "false"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PKG_NAME: luci-app-openlistui

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target_path: snapshots/targets/x86/64
          - arch: aarch64
            target_path: snapshots/targets/armsr/armv8
          - arch: mips
            target_path: snapshots/targets/ath79/generic
          - arch: mipsel
            target_path: snapshots/targets/ramips/mt76x8
          - arch: arm
            target_path: snapshots/targets/bcm27xx/bcm2708
          - arch: armv7
            target_path: snapshots/targets/bcm27xx/bcm2709

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-setuptools python3-venv \
            rsync unzip zlib1g-dev file wget curl jq zstd

      - name: Sanity check (no distutils)
        run: |
          python3 -V
          dpkg -l | grep -E "python3-setuptools|python3-venv" || true

      - name: Download OpenWrt SDK (auto-detect filename)
        id: sdk
        run: |
          set -e
          BASE="https://downloads.openwrt.org"
          IDX="${BASE}/${{ matrix.target_path }}/"
          echo "Index: ${IDX}"

          # 抓取目录页，找 SDK tarball（Linux-x86_64）
          SDK_TARBALL=$(curl -fsSL "${IDX}" | grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.xz' | head -n1)

          if [ -z "${SDK_TARBALL}" ]; then
            echo "❌ Cannot find SDK tarball on ${IDX}"
            echo "Try listing a few entries:"
            curl -fsSL "${IDX}" | head -n 60 || true
            exit 1
          fi

          echo "SDK_TARBALL=${SDK_TARBALL}" >> $GITHUB_OUTPUT
          echo "SDK_URL=${BASE}/${{ matrix.target_path }}/${SDK_TARBALL}" >> $GITHUB_OUTPUT

          echo "Found: ${SDK_TARBALL}"
          echo "URL:   ${BASE}/${{ matrix.target_path }}/${SDK_TARBALL}"

          wget -q --show-progress -O sdk.tar.xz "${BASE}/${{ matrix.target_path }}/${SDK_TARBALL}"
          mkdir -p sdk
          tar -xf sdk.tar.xz --strip-components=1 -C sdk

      - name: Prepare package in SDK
        run: |
          set -e
          cd sdk

          rm -rf package/${PKG_NAME}
          mkdir -p package/${PKG_NAME}

          # 复制仓库里的包源码进 SDK
          # 兼容 Makefile/luasrc/root/po/htdocs
          cp -r ../Makefile package/${PKG_NAME}/
          [ -d ../luasrc ] && cp -r ../luasrc package/${PKG_NAME}/ || true
          [ -d ../root ]   && cp -r ../root   package/${PKG_NAME}/ || true
          [ -d ../po ]     && cp -r ../po     package/${PKG_NAME}/ || true
          [ -d ../htdocs ] && cp -r ../htdocs package/${PKG_NAME}/ || true

      - name: Update feeds (optional)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.fast != 'true' }}
        run: |
          set -e
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install minimal luci deps (best-effort)
        run: |
          set -e
          cd sdk
          ./scripts/feeds update -a || true
          ./scripts/feeds install luci-base luci-lib-jsonc luci-lib-nixio || true

      - name: Configure for APK output + select package
        run: |
          set -e
          cd sdk

          # 关键：启用 APK 输出
          echo "CONFIG_USE_APK=y" > .config
          echo "CONFIG_PACKAGE_${PKG_NAME}=y" >> .config

          make defconfig

          echo "=== .config (filtered) ==="
          grep -E "CONFIG_USE_APK|CONFIG_PACKAGE_${PKG_NAME}" .config || true

      - name: Build package
        run: |
          set -e
          cd sdk
          JOBS="${{ github.event_name == 'workflow_dispatch' && inputs.jobs || '4' }}"
          make package/${PKG_NAME}/compile V=s -j${JOBS}

      - name: Collect APK
        id: out
        run: |
          set -e
          cd sdk
          mkdir -p ../output

          # LuCI 包通常在 bin/packages/*/luci/
          APK=$(find bin -type f -name "*${PKG_NAME}*.apk" | head -n1 || true)

          if [ -z "${APK}" ]; then
            echo "❌ .apk not found. Listing candidates:"
            find bin -type f \( -name "*${PKG_NAME}*" -o -name "*.apk" -o -name "*.ipk" \) | head -n 200
            echo ""
            echo "Hint: if only .ipk exists, the SDK/branch may not support apk or CONFIG_USE_APK didn't take effect."
            exit 1
          fi

          OUT_NAME="${PKG_NAME}_${{ matrix.arch }}.apk"
          cp -v "${APK}" "../output/${OUT_NAME}"

          echo "apk_path=output/${OUT_NAME}" >> $GITHUB_OUTPUT
          ls -lh ../output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.arch }}-apk
          path: ${{ steps.out.outputs.apk_path }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List dist
        run: |
          find dist -type f -maxdepth 6 -print
          ls -lh dist || true

      - name: Publish GitHub Release with APK assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
